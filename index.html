<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCERT Class 8 Science Labs - Dr AI Academy</title>
    <style>
        :root {
            --primary-green: #059669;
            --accent-orange: #f59e0b;
            --bg-playful: #f0fdf4;
            --dark-blue: #0f172a;
        }

        /* 🔒 SECURITY: Disabling text selection across the website */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-playful);
            margin: 0;
            padding: 0;
            color: #1e293b;
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and Older */
            user-select: none; /* Standard syntax */
        }

        .top-bar { background: var(--dark-blue); padding: 10px 20px; text-align: right; }
        .top-bar a { color: #38bdf8; text-decoration: none; font-weight: bold; font-size: 14px; }
        .top-bar a:hover { color: #fbbf24; text-decoration: underline; }

        header {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            text-align: center;
            padding: 40px 20px 50px 20px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 10px 25px rgba(5, 150, 105, 0.15);
        }

        header h1 { margin: 0; font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.15); }
        header p { margin: 10px 0 25px 0; font-size: 1.2rem; opacity: 0.9; }

        .search-container { max-width: 550px; margin: 0 auto; position: relative; }
        .search-container input { width: 100%; padding: 15px 25px 15px 50px; font-size: 1.1rem; border: none; border-radius: 50px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15); outline: none; box-sizing: border-box; }
        .search-container input:focus { transform: scale(1.02); }
        .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); font-size: 1.3rem; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 25px; }

        .card { background: white; border-radius: 20px; padding: 24px; box-shadow: 0 8px 16px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: space-between; border: 2px solid #e2e8f0; }
        .card:hover { transform: translateY(-8px); border-color: var(--primary-green); }
        
        .card-tags { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .tag { font-size: 0.75rem; font-weight: bold; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; }
        .tag-chapter { background-color: #fef3c7; color: #d97706; }
        .tag-general { background-color: #e0f2fe; color: #0369a1; }

        .card h3 { font-size: 1.2rem; margin: 0 0 10px 0; color: #0f172a; min-height: 50px; display: flex; align-items: center; }
        .card p { font-size: 0.95rem; color: #64748b; line-height: 1.5; margin-bottom: 20px; }
        .card a { display: block; text-align: center; padding: 12px; color: white; text-decoration: none; border-radius: 30px; font-weight: bold; }

        #status-message { text-align: center; font-size: 1.3rem; color: #64748b; padding: 50px; }
        footer { text-align: center; padding: 35px 20px; margin-top: 60px; color: #94a3b8; border-top: 1px solid #e2e8f0; background: white; }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="https://draiacademy.com" target="_blank">By - Dr AI Academy 🚀</a>
    </div>

    <header>
        <h1>🧪 Class 8 Science Virtual Labs ⚡</h1>
        <p>Interactive Experiments & Conceptual Discovery Games</p>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="lab-search" placeholder="Search by topic or chapter..." oninput="handleSearch()">
        </div>
    </header>

    <div class="container">
        <div id="status-message">🔄 Synchronizing Lab Repositories...</div>
        <div class="grid" id="labs-grid"></div>
    </div>

    <footer>
        <p>&copy; 2026 Dr AI Academy. Building Interactive Intelligence for Young Explorers.</p>
    </footer>

    <script>
        // 🔒 SECURITY SCRIPT: Anti-Right Click and Anti-Inspect Element
        document.addEventListener('contextmenu', event => event.preventDefault()); // Right Click Disabled

        document.onkeydown = function(e) {
            // Block F12
            if(e.keyCode == 123) { return false; }
            // Block Ctrl+Shift+I (Inspect)
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
            // Block Ctrl+Shift+J (Console)
            if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
            // Block Ctrl+U (View Source)
            if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
            // Block Ctrl+S (Save Page)
            if(e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) { return false; }
        };

        const username = 'DrAIAcademy';
        const repo = 'ncert-class8-science-labs';
        
        const kidThemes = [
            { btn: '#059669' }, { btn: '#0ea5e9' }, { btn: '#ec4899' },
            { btn: '#f59e0b' }, { btn: '#8b5cf6' }, { btn: '#3b82f6' }
        ];

        let masterLabsList = [];

        function extractChapterInfo(filename) {
            const chMatch = filename.match(/_ch(\d+)_/i);
            if (chMatch) return { isChapter: true, label: `Chapter ${chMatch[1]}` };
            return { isChapter: false, label: `General Lab` };
        }

        function formatTitle(filename) {
            let name = filename.replace('.html', '').replace(/^dr_ai_/, '').replace(/_3d$/i, '').replace(/_fixed$/i, '').replace(/_clean$/i, '');
            name = name.replace(/ch\d+_\d*_?/, '').replace(/lab\d+_\d*_?/, '').replace(/ch\d+_\s*?/, '');
            name = name.replace(/_/g, ' ').replace(/-/g, ' ');
            return name.replace(/\b\w/g, c => c.toUpperCase());
        }

        function createDescription(title) {
            return `Dive into the core concept of ${title}. Perfect for NCERT Class 8 revision, practical worksheets, and interactive experiment mock-ups.`;
        }

        async function fetchLabs() {
            const grid = document.getElementById('labs-grid');
            const statusMessage = document.getElementById('status-message');
            
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents`);
                const files = await response.json();
                const htmlFiles = files.filter(file => file.name.endsWith('.html') && file.name !== 'index.html');
                
                statusMessage.style.display = 'none';

                if(htmlFiles.length === 0) {
                    statusMessage.style.display = 'block';
                    statusMessage.innerHTML = '⚠️ No virtual simulations are currently active.';
                    return;
                }

                htmlFiles.forEach(file => {
                    const chapterInfo = extractChapterInfo(file.name);
                    const formattedTitle = formatTitle(file.name);
                    masterLabsList.push({
                        filename: file.name,
                        title: formattedTitle,
                        chapter: chapterInfo.label,
                        isChapterBased: chapterInfo.isChapter,
                        desc: createDescription(formattedTitle)
                    });
                });

                renderDashboard(masterLabsList);
            } catch (error) {
                statusMessage.innerHTML = '❌ Failed to fetch database.';
            }
        }

        function renderDashboard(items) {
            const grid = document.getElementById('labs-grid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#64748b;">🔍 No matching labs found!</p>';
                return;
            }

            items.forEach((lab, index) => {
                const theme = kidThemes[index % kidThemes.length];
                const tagClass = lab.isChapterBased ? 'tag-chapter' : 'tag-general';

                grid.innerHTML += `
                    <div class="card">
                        <div>
                            <div class="card-tags"><span class="tag ${tagClass}">${lab.chapter}</span></div>
                            <h3>${lab.title}</h3>
                            <p>${lab.desc}</p>
                        </div>
                        <a href="${lab.filename}" style="background-color: ${theme.btn};">Start Experiment ➔</a>
                    </div>
                `;
            });
        }

        function handleSearch() {
            const query = document.getElementById('lab-search').value.toLowerCase().trim();
            if (!query) { renderDashboard(masterLabsList); return; }
            const filtered = masterLabsList.filter(lab => 
                lab.title.toLowerCase().includes(query) || lab.desc.toLowerCase().includes(query) || lab.chapter.toLowerCase().includes(query)
            );
            renderDashboard(filtered);
        }

        fetchLabs();
    </script>
</body>
</html>
